name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
      env:
        BRAINPOP_USERNAME: ${{ secrets.BRAINPOP_USERNAME }}
        BRAINPOP_PASSWORD: ${{ secrets.BRAINPOP_PASSWORD }}
        BRAINPOP_EMAIL: ${{ secrets.BRAINPOP_EMAIL }}
      # No report artifact is uploaded: Playwright's trace/report records the
      # literal values passed to fill() (including the real login
      # credentials used to authenticate), and this repo is public — an
      # uploaded artifact would make those credentials downloadable by
      # anyone. Debug locally with `npm run report` / `npm run test:ui`
      # instead, where the report never leaves your machine.
